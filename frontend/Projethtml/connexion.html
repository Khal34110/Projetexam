<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="stylesheet" href="../stylescss/connexion.css">
  <link rel="stylesheet" href="../stylescss/header-footer.css">
</head>

<body class="page-auth page-login">
<header id="header">




</header>
  <main>
  <section class="connexion">
    <div class="form">
         <h1>Connexion</h1>
         <p>Veuillez entrer vos identifiants pour vous connecter.</p>
      <form class="formulaire" id="login-form" novalidate>
        <div class="identite">
          <input type="email" name="email" id="login-email" placeholder="Email" autocomplete="email" required>
          <input type="password" name="mot_de_passe" id="login-password" placeholder="Mot de passe" autocomplete="current-password" required>
        </div>
        <div class="conf">
          <button type="submit">Se connecter</button>
        </div>
        <p class="form-feedback" id="login-feedback" aria-live="polite"></p>
        <p class="forgot-password">
          <a href="reinitialisation.html">Mot de passe oublié ?</a>
        </p>
      </form>
    </div>
  </section>
  <div class="compte">
    <p>Vous n'avez pas de compte ? <a href="inscription.html">Inscrivez-vous</a></p>
  </div>
  </main>
  <footer class="footer">
</footer>

<script type="module" src="../Projetjs/utilisateur.js"></script>

</body>

</html>
