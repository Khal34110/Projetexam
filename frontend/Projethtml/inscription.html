<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription</title>
  <link rel="stylesheet" href="../stylescss/inscription.css">
  <link rel="stylesheet" href="../stylescss/header-footer.css">
</head>

<body class="page-auth page-signup">
  <header id="header">

  </header>
  <main>
    <section class="inscription">
      <h1>Inscription</h1>
      <form class="formulaire" id="signup-form" novalidate>
        <div class="info">
          <input type="text" name="nom" id="signup-nom" placeholder="Nom" autocomplete="family-name" required>
          <input type="text" name="prenom" id="signup-prenom" placeholder="Prénom" autocomplete="given-name" required>
        </div>
        <div class="tel">
          <input type="email" name="email" id="signup-email" placeholder="Email" autocomplete="email" required>
          <input type="tel" name="numero_de_telephone" id="signup-telephone" placeholder="Numéro de téléphone" autocomplete="tel" required>
          <input type="password" name="mot_de_passe" id="signup-password" placeholder="Mot de passe" autocomplete="new-password" required>
          <input type="password" name="confirmation_mot_de_passe" id="signup-password-confirmation" placeholder="Confirmation du mot de passe" autocomplete="new-password" required>
        </div>
        <div class="conf">
          <button type="submit">Confirmer l’inscription</button>
        </div>
        <p class="form-feedback" id="signup-feedback" aria-live="polite"></p>
      </form>

      <div class="reseaux">
        <p>S’inscrire avec</p>
        <div class="icons">
          <img class="logos" src="../image/autocollants-google-icone.png" alt="Logo Google">
          <img class="logos" src="../image/Instagram_icon.png" alt="Logo Instagram">
          <img class="logos" src="../image/facebook_icone.png" alt="Logo Facebook">
          <img class="logos" src="../image/icone x.png" alt="Logo X">
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
  </footer>

  <script type="module" src="../Projetjs/utilisateur.js"></script>


</body>

</html>
